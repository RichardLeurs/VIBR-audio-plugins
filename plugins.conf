#
# plugins.conf: which build group every plugin belongs to. One line per plugin:  <name>  <group>
# Groups (the same as on the website):  new  vintage  experimental  mastering  multieffect  drumcomputer
# CMake collects the signed bundles of a plugin in  releases/<arch>/<group>/{VST3,AU,Standalone}  and build.sh zips each folder
# to  zip/VIBR-<group>-<format>-<arch>.zip.  A plugin that is missing here stops the configure step.
# The name is the plugin's folder name under src/ with or without the dash (DD-1 = dd1); lines starting with # are ignored.

