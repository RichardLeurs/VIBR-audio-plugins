#
# plugins.conf: which build group every plugin belongs to. One line per plugin:  <name>  <group>
# Groups (the same as on the website):  new  vintage  experimental  mastering  multieffect  drumcomputer
# CMake collects the signed bundles of a plugin in  releases/<arch>/<group>/{VST3,AU,Standalone}  and build.sh zips each folder
# to  zip/VIBR-<group>-<OS>-<format>-<arch>-<version>.zip.  A plugin that is missing here stops the configure step.
# Add the word  test  after the group to build a plugin as a test version:  SF-1  experimental  test
# A test plugin is collected in  <BUILD_OUTPUT_DIR>/test/<arch>/<group>/{VST3,AU,Standalone}  (~/Developer/VIBR/test/arm64/...), is not zipped by build.sh and is not
# part of the releases or the website. It keeps its group so you can see where it belongs (new, vintage or experimental).
# The name is the plugin's folder name under src/ with or without the dash (DD-1 = dd1); lines starting with # are ignored.

