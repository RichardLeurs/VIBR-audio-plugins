name: macOS arm64 build

# VIBR audio plugins | Copyright © Richard Leurs 2026 | GPL3.0 License

# Builds all VIBR plugins (VST3, AU and Standalone) for Apple Silicon (arm64) with ./build.sh --arch arm64, using the groups in config/plugins.conf.
# The bundles are signed ad-hoc (the local signing identity does not exist on the runner), so macOS may ask the user to allow them.
# Start it from the Actions tab, or push a tag like v1.0: the zips (VIBR-<group>-<OS>-<format>-<arch>-<version>.zip) are then also uploaded to the GitHub release of that tag.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: Build (VST3 + AU + Standalone)
        env:
          JOBS: 4
        run: ./build.sh --arch arm64

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-build-log
          path: ~/Developer/VIBR/build.log
          if-no-files-found: ignore

      - name: Collect zips
        run: |
          mkdir -p dist
          ls -l ~/Developer/VIBR/zip
          cp ~/Developer/VIBR/zip/*-macOS-*-arm64-*.zip dist/

      - uses: actions/upload-artifact@v5
        with:
          name: vibr-arm64
          path: dist/*.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
