name: Linux x86_64 build

# VIBR audio plugins | Copyright © Richard Leurs 2026 | GPL3.0 License

# Builds all VIBR plugins (VST3 + Standalone) for 64-bit Linux, x86_64 (./build.sh --arch linux64), using the groups in config/plugins.conf. There is no AU on Linux.
# ubuntu-22.04 is old enough that the plugins also load on older distributions (glibc). The Linux build is not tested by the project.
# Start it from the Actions tab, or push a tag like v1.0: the zips (VIBR-<group>-<OS>-<format>-<arch>-<version>.zip) are then also uploaded to the GitHub release of that tag.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: Install the JUCE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git zip \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev libcurl4-openssl-dev

      - name: Build (VST3 + Standalone)
        env:
          JOBS: 4
        run: ./build.sh --arch linux64

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64-build-log
          path: ~/Developer/VIBR-linux/build.log
          if-no-files-found: ignore

      - name: Collect zips
        run: |
          mkdir -p dist
          ls -l ~/Developer/VIBR/zip
          cp ~/Developer/VIBR/zip/*-Linux-*-linux64-*.zip dist/

      - uses: actions/upload-artifact@v5
        with:
          name: vibr-linux64
          path: dist/*.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
